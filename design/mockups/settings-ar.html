<!doctype html>
<!--
  Settings, first drawing, at the owner's order (2026-11-18): the owner's reference (two columns of sections, each a card of
  rows) with what Castivio does not need taken out and what it does added.

  Taken out, because each lives somewhere else or does nothing:
    - Theme and language: the two buttons at the top of Home.
    - Account settings: the subscriptions are Home's (switch playlist, my subscriptions); the device and its MAC are on Home.
    - Player settings: speed, picture shape, quality, sound and the subtitles' look are the player's own gear panel.
    - Notifications: Castivio sends none.
    - "Enable PIN": a channel is locked on its own, from the channels board; there is no lock to turn on for everything.
    - "Contact us": the same door as Help and support.

  Kept: Motion (full / reduced / none -- an input rule of the project, and nowhere else), as a row of the application's card
  with its three levels in it; Change the lock's password;
  Restore the hidden bouquets and channels (hiding is on the channels board, bringing back is only here); About, which opens
  the licence screen (licence, device, version).
  Added: the preferred AUDIO language and the preferred SUBTITLE language (the player picks the track in that language when a
  film or channel has one); Clear the picture cache, with its size.
  Help, privacy and terms: kept, waiting for their texts and the support address.

  States drawn: a row under the remote's focus; a count of nothing hidden (a line of information, nothing to press, no
  arrow); the choice of a language, as a list over the page with the one in use ticked.

    ?frame=<name>&clean=1   one screen alone: tv, phone, audio-tv, audio-phone
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Settings</title>
<style>
:root{
  --ground:#111327; --panel:#20223A; --edgeSoft:rgba(255,255,255,.08);
  --glassBorder:rgba(255,255,255,.16); --solid:rgba(6,6,16,.72);
  --azure:#4C9BFF; --focus:#6FB2FF; --violet:#B694FF; --violetDeep:#6E4BD8;
  --strong:#F4F2FA; --label:#A9A8C2; --muted:#8C8CA8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05040E;color:var(--strong);font-family:Inter,"Noto Sans Arabic","DejaVu Sans",sans-serif}
svg{display:block;flex:none}
.screen{position:relative;overflow:hidden;direction:rtl;
  background:radial-gradient(120% 90% at 15% 0%,#1B1F3F 0%,rgba(27,31,63,0) 60%),linear-gradient(200deg,#13152D,var(--ground))}
.phone{width:833px;height:385px}
.tv{width:960px;height:540px}

/* ---------- the page ---------- */
.page{position:absolute;inset:0;padding:16px 40px 0;display:flex;flex-direction:column;gap:12px}
.tv .page{padding:28px 48px 0;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex:none}
.back{width:40px;height:40px;border-radius:10px;background:var(--solid);border:1px solid var(--glassBorder);display:flex;align-items:center;justify-content:center}
.back svg{width:20px;height:20px;fill:var(--azure)}
.title{display:flex;align-items:center;gap:10px;font:700 22px "Noto Sans Arabic",sans-serif}
.tv .title{font-size:26px}
.title svg{width:24px;height:24px;fill:var(--strong)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.tv .cols{gap:18px}
.col{display:flex;flex-direction:column;gap:12px}
.tv .col{gap:14px}

/* a section: its title, then its rows, on one card */
.card{border-radius:16px;background:rgba(32,34,58,.72);border:1px solid var(--edgeSoft);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.card h3{display:flex;align-items:center;gap:8px;font:700 14px "Noto Sans Arabic",sans-serif;color:var(--violet);padding:2px 4px 4px}
.tv .card h3{font-size:15.5px}
.card h3 svg{width:18px;height:18px;fill:var(--violet)}
.row{height:40px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid transparent;display:flex;align-items:center;gap:12px;padding:0 12px;font:500 13.5px "Noto Sans Arabic",sans-serif}
.tv .row{height:40px;font-size:14.5px}
.row .ic{width:20px;height:20px;fill:var(--label)}
.row .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{color:var(--label);font:500 13px Inter,"Noto Sans Arabic",sans-serif;white-space:nowrap}
.row .vl.ltr{direction:ltr}
.row .ch{width:18px;height:18px;fill:var(--label)}
.row.focus{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus),0 0 18px rgba(111,178,255,.35);background:rgba(76,155,255,.10)}
.row.focus .ic,.row.focus .ch{fill:var(--strong)}
/* nothing to press: a line of information, quieter, and no arrow */
.row.idle{background:transparent;border-color:var(--edgeSoft)}
.row.idle .lb,.row.idle .vl{color:var(--muted)}
.row.idle .ic{fill:var(--muted)}
/* the motion level: its name, and its three levels in the row itself -- left and right on the remote move between them */
.seg{display:flex;gap:5px}
.seg span{height:30px;padding:0 12px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--edgeSoft);display:flex;align-items:center;font:600 12.5px "Noto Sans Arabic",sans-serif;color:var(--label);white-space:nowrap}
.seg span.on{background:linear-gradient(180deg,#4C9BFF,#2F6FE0);color:#fff;border-color:transparent}
.hint{font:12px/1.5 "Noto Sans Arabic",sans-serif;color:var(--muted);padding:0 4px}
.tv .hint{font-size:12.5px}

/* ---------- the choice of a language, over the page ---------- */
.veil{position:absolute;inset:0;background:rgba(5,4,14,.62)}
.sheet{position:absolute;top:0;bottom:0;left:0;width:330px;background:#171A33;border-right:1px solid var(--glassBorder);padding:18px 18px;display:flex;flex-direction:column;gap:8px;box-shadow:12px 0 40px rgba(0,0,0,.5)}
.tv .sheet{width:380px;padding:28px 24px;gap:9px}
.sheet h3{font:700 17px "Noto Sans Arabic",sans-serif;margin-bottom:2px}
.sheet p{font:12.5px/1.5 "Noto Sans Arabic",sans-serif;color:var(--muted);margin-bottom:6px}
.opt{height:40px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid transparent;display:flex;align-items:center;gap:10px;padding:0 14px;font:500 14px "Noto Sans Arabic",Inter,sans-serif}
.opt .lb{flex:1}
.opt small{color:var(--muted);font:12px "Noto Sans Arabic",sans-serif}
.opt svg{width:18px;height:18px;fill:var(--azure)}
.opt.on{background:rgba(76,155,255,.12)}
.opt.focus{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 000-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 00-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 000 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 001.7 1L11 21h4l.4-2.9a7.4 7.4 0 001.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-2 14.5v-9l6 4.5z"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></symbol>
  <symbol id="i-cc" viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 00-2 2v12a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-4a1 1 0 011-1h3a1 1 0 011 1zm7 0h-1.5v-.5h-2v3h2V13H18v1a1 1 0 01-1 1h-3a1 1 0 01-1-1v-4a1 1 0 011-1h3a1 1 0 011 1z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 007 6v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zm-6 9a2 2 0 110-4 2 2 0 010 4zm3.1-9H8.9V6a3.1 3.1 0 016.2 0z"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><path d="M12.7 10A6 6 0 101 12a6 6 0 0011.7 2H17v4h4v-4h2v-4zM7 14a2 2 0 110-4 2 2 0 010 4z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5c-1.7-4.4-6-7.5-11-7.5zM12 17a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></symbol>
  <symbol id="i-bouquet" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></symbol>
  <symbol id="i-tv" viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 00-2 2v12a2 2 0 002 2h5v2h8v-2h5a2 2 0 002-2V5a2 2 0 00-2-2zm0 14H3V5h18z"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 000 18 1.5 1.5 0 001.1-2.5 1.5 1.5 0 011.1-2.5H16a5 5 0 005-5c0-4.4-4-8-9-8zm-5.5 9a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></symbol>
  <symbol id="i-motion" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4v2h-2.6L14 22 10 6l-1.6 6H3z"/></symbol>
  <symbol id="i-app" viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 17h-2v-2h2zm2.1-7.7l-.9.9A3.4 3.4 0 0013 15h-2v-.5a4 4 0 011.2-2.8l1.2-1.3A2 2 0 0014 9a2 2 0 00-4 0H8a4 4 0 018 0 3.2 3.2 0 01-.9 2.3z"/></symbol>
  <symbol id="i-support" viewBox="0 0 24 24"><path d="M12 1a9 9 0 00-9 9v7a3 3 0 003 3h3v-8H5v-2a7 7 0 0114 0v2h-4v8h4v1h-7v2h6a3 3 0 003-3V10a9 9 0 00-9-9z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.6 3.8 10.7 9 12 5.2-1.3 9-6.4 9-12V5z"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zm2 16H8v-2h8zm0-4H8v-2h8zm-3-5V3.5L18.5 9z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></symbol>
</svg>
<div id="out"></div>
<script>
const I=(id,c='')=>`<svg class="${c}" viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
// A row: its icon, its name, what it is now, and the arrow -- or none, when there is nothing to press.
const row=(ic,label,value,{focus=false,idle=false,ltr=false}={})=>
  `<div class="row ${focus?'focus':''} ${idle?'idle':''}">${I(ic,'ic')}<span class="lb">${label}</span>`+
  (value!=null?`<span class="vl ${ltr?'ltr':''}">${value}</span>`:'')+(idle?'':I('i-chev','ch'))+`</div>`;
const card=(ic,title,body)=>`<div class="card"><h3>${I(ic)}${title}</h3>${body}</div>`;

function page(focus){
  const player=card('i-play','المشغّل',
    row('i-audio','لغة الصوت المفضلة','العربية',{focus:focus==='audio'})+
    row('i-cc','لغة الترجمة المفضلة','العربية'));
  const hidden=card('i-eye','العناصر المخفية',
    row('i-bouquet','استعادة الباقات المخفية','3')+
    row('i-tv','استعادة القنوات المخفية','0',{idle:true}));
  const lock=card('i-lock','قفل القنوات',
    row('i-key','تغيير رمز القفل',null));
  const motion=`<div class="row">${I('i-motion','ic')}<span class="lb">الحركة</span><div class="seg"><span class="on">كاملة</span><span>مخففة</span><span>بلا</span></div></div>`;
  const app=card('i-app','التطبيق',
    motion+
    row('i-image','مسح ذاكرة الصور','48 MB',{ltr:true})+
    row('i-info','حول التطبيق','v1.0.0',{ltr:true}));
  const help=card('i-help','المساعدة',
    row('i-support','المساعدة والدعم',null)+
    row('i-shield','سياسة الخصوصية',null)+
    row('i-doc','شروط الاستخدام',null));
  return `<div class="page">
    <div class="top"><div class="back">${I('i-back')}</div><div class="title">${I('i-gear')}الإعدادات</div></div>
    <div class="cols">
      <div class="col">${player}${hidden}${lock}</div>
      <div class="col">${app}${help}</div>
    </div></div>`;
}
function audioSheet(){
  const o=(label,note,on,focus)=>`<div class="opt ${on?'on':''} ${focus?'focus':''}"><span class="lb">${label}</span>${note?`<small>${note}</small>`:''}${on?I('i-tick'):''}</div>`;
  return `<div class="veil"></div><div class="sheet">
    <h3>لغة الصوت المفضلة</h3>
    <p>إن كان للفيلم أو القناة صوت بهذه اللغة شُغِّل به، وإلا فصوته الأصلي.</p>
    ${o('تلقائي','الصوت الأصلي',false,false)}
    ${o('العربية',null,true,true)}
    ${o('English',null,false,false)}
    ${o('Français',null,false,false)}
    ${o('Español',null,false,false)}
    ${o('Deutsch',null,false,false)}
    ${o('Türkçe',null,false,false)}
  </div>`;
}
const frames={
  'tv':()=>`<div class="screen tv">${page('audio')}</div>`,
  'phone':()=>`<div class="screen phone">${page(null)}</div>`,
  'audio-tv':()=>`<div class="screen tv">${page(null)}${audioSheet()}</div>`,
  'audio-phone':()=>`<div class="screen phone">${page(null)}${audioSheet()}</div>`,
};
const q=new URLSearchParams(location.search).get('frame')||'tv';
document.getElementById('out').innerHTML=frames[q]();
</script>
</body>
</html>
