<!doctype html>
<!--
  ONE template for a title's page -- a film's and a show's -- over a softened, darkened wide picture. The second drawing,
  after details-backdrop-ar.html (built as LOCAL_CHANGES section 135), at the owner's order with his notes on it:

    1. The picture: less sharp, under a darker graded black. Asked for SMALL (TMDB w300) and stretched, so it is soft on
       every device: a blur effect does nothing under Android 12, which is most television boxes. Under it a black at 0.28,
       then the gradient deepest under the text (0.92) and opening toward the poster (0.20), then the foot closing to the ground.
    2. The poster: as it is, the same size and place.
    3. The facts bar, the favourite and the rating: on a dark, near-opaque ground (black at 0.72), no longer thin glass.
    4. The words: strong contrast. The name and the plot in the strong ink (#F4F2FA), the people's names in the strong ink,
       their labels ("المخرج:", "الممثلون:") a step quieter so the names stand out.
    5. ONE order for both, from one component (DetailsPage):
         the name and the way back / the facts bar / Play and the favourite / the rating and the date /
         "القصة" with "Show all" / the plot / the people / and below, what is a show's own: seasons and episodes.
       What a page does not have is left out, and the rows close up: a film has no seasons; a show from a provider that sent
       no cast has no people row; a film with no rating and no date has no rating row.
    6. The picture is never a condition of the page. No picture, a picture that failed, or one still coming: the page is
       drawn on the application's own gradient at once -- the frames "none" and "arriving" -- and the picture, when it
       comes, fades in over it.

  Geometry and colours are the approved drawing's and Color.kt's. The pictures are stand-ins drawn in CSS; the names,
  facts and plots are examples.

    ?frame=<name>   one frame: film, show, tv, bright, none, arriving
    ?frame=sheet    (the default) every frame with its caption
    &clean=1        with ?frame=: the screen alone, no label on it (details-template-tv-1280x720.png, details-template-phone.png)
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Details template</title>
<style>
:root{
  --ground:#111327; --panel:#20223A; --edgeSoft:rgba(255,255,255,.08);
  --glassBorder:rgba(255,255,255,.16); --solid:rgba(6,6,16,.72);
  --azure:#4C9BFF; --gold:#F5C518; --strong:#F4F2FA; --label:#A9A8C2; --muted:#8C8CA8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05040E;color:var(--strong);font-family:Inter,"Noto Sans Arabic","DejaVu Sans",sans-serif}
body.sheet{padding:22px;width:max-content;direction:ltr}
svg{display:block;flex:none}
.cap{direction:rtl;text-align:right;width:960px;font:15px/1.6 "Noto Sans Arabic",Inter,sans-serif;color:#a4a4c0;margin:22px 0 10px}
.cap b{color:#fff}

/* the application's own ground: what the page stands on with no picture, and under a picture still coming */
.screen{position:relative;overflow:hidden;direction:rtl;
  background:radial-gradient(120% 90% at 15% 0%,#1B1F3F 0%,rgba(27,31,63,0) 60%),linear-gradient(200deg,#13152D,var(--ground))}
.phone{width:833px;height:385px}
.tv{width:960px;height:540px}

/* ---------- 1. the picture: small and stretched (soft on every device), under black, under the gradient ---------- */
.bd{position:absolute;inset:-14px;filter:blur(4px) saturate(.9);transform:scale(1.04)}
.bd.dusk{background:
  radial-gradient(5% 16% at 20% 62%,#1a0f14 0%,#1a0f14 70%,rgba(26,15,20,0) 100%),
  radial-gradient(5% 15% at 26% 63%,#24131a 0%,#24131a 70%,rgba(36,19,26,0) 100%),
  repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 40px,rgba(30,18,26,.9) 40px 70px,rgba(0,0,0,0) 70px 95px),
  linear-gradient(180deg,rgba(0,0,0,0) 58%,#2b1a24 58.5%,#1d1219 100%),
  radial-gradient(14% 22% at 62% 52%,#ffd59a 0%,#ffb565 35%,rgba(255,181,101,0) 100%),
  radial-gradient(45% 60% at 35% 35%,#f0a35a 0%,rgba(240,163,90,0) 70%),
  radial-gradient(35% 45% at 75% 60%,#7b4a8f 0%,rgba(123,74,143,0) 70%),
  linear-gradient(200deg,#3b2a55 0%,#5a3420 60%,#1d1426 100%)}
.bd.ice{background:
  radial-gradient(6% 26% at 28% 52%,#e9eef5 0%,#c9d6e6 55%,rgba(201,214,230,0) 100%),
  linear-gradient(180deg,rgba(0,0,0,0) 70%,#8fa6c2 70.5%,#3c536f 100%),
  radial-gradient(40% 55% at 70% 45%,#cfe0ef 0%,rgba(207,224,239,0) 70%),
  linear-gradient(160deg,#28405f 0%,#16243a 55%,#0b1222 100%)}
.bd.snow{background:radial-gradient(60% 70% at 40% 40%,#ffffff 0%,#f2f4f8 40%,rgba(242,244,248,0) 80%),linear-gradient(180deg,#e8ecf2,#cfd6e0)}
.black{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.scrim{position:absolute;inset:0;background:
  linear-gradient(to right,rgba(8,8,18,.92) 0%,rgba(8,8,18,.80) 40%,rgba(8,8,18,.40) 72%,rgba(8,8,18,.20) 100%),
  linear-gradient(to bottom,rgba(17,19,39,0) 55%,var(--ground) 100%)}
.arriving .bd,.arriving .black,.arriving .scrim{opacity:.3}

/* ---------- the page ---------- */
.page{position:absolute;inset:0;display:flex;gap:28px;padding:17px 40px}
.tv .page{padding:30px 48px;gap:36px}
.tv .facts{height:38px;border-radius:19px;font-size:13.5px;margin-top:12px}
.tv .facts svg{width:16px;height:16px}
.tv .btns{margin-top:16px}
.tv .btn{height:54px;font-size:17px;padding:0 30px}
.tv .rrow{margin-top:14px}
.tv .imdb,.tv .chip{height:32px;font-size:13.5px;border-radius:16px}
.tv .head{margin-top:16px;font-size:15px}
.tv .more{font-size:14px}
.poster{flex:none;border-radius:12px;border:1px solid var(--edgeSoft);overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.poster.dusk{background:linear-gradient(170deg,#f2b56b 0%,#c5683a 45%,#4a2a3c 100%)}
.poster.ice{background:radial-gradient(60% 50% at 50% 55%,#e8f1fa 0%,#9fb6cf 45%,#2a3b55 100%)}
.poster.snow{background:linear-gradient(170deg,#ffffff 0%,#dfe5ee 60%,#9aa7b8 100%)}
.poster.flat{background:linear-gradient(170deg,#e6c970 0%,#c99d3c 45%,#8a6422 100%)}
.poster b{position:absolute;left:0;right:0;top:9%;text-align:center;font:800 12px/1 Inter,sans-serif;letter-spacing:4px;color:rgba(255,255,255,.92);direction:ltr}
.poster.snow b{color:#3a4250}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.prov{direction:ltr;text-align:right;unicode-bidi:plaintext}
.trow{display:flex;align-items:center;gap:8px}
.name{flex:1;font-weight:700;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--strong);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.tv .name{font-size:34px}
.back{flex:none;width:40px;height:40px;border-radius:10px;background:var(--solid);border:1px solid var(--glassBorder);display:flex;align-items:center;justify-content:center}
.back svg{width:20px;height:20px;fill:var(--azure)}
/* 3. dark, near-opaque grounds */
.facts{margin-top:8px;height:32px;border-radius:16px;background:var(--solid);border:1px solid var(--glassBorder);
  display:flex;align-items:center;padding:0 14px;font-size:11.5px;white-space:nowrap;overflow:hidden;align-self:flex-start}
.facts i{flex:none;width:1px;height:16px;background:var(--glassBorder);margin:0 10px}
.facts span{display:flex;align-items:center;gap:6px;flex:none;color:var(--strong)}
.facts svg{width:14px;height:14px;fill:var(--label)}
.btns{margin-top:12px;display:flex;gap:10px}
.btn{height:46px;border-radius:12px;display:flex;align-items:center;gap:8px;padding:0 24px;font:600 15px "Noto Sans Arabic",Inter,sans-serif}
.btn svg{width:20px;height:20px}
.btn.p{background:linear-gradient(180deg,#4C9BFF,#2F6FE0);color:#fff;box-shadow:0 6px 18px rgba(47,111,224,.35)} .btn.p svg{fill:#fff}
.btn.s{background:var(--solid);border:1px solid var(--glassBorder);color:var(--strong)} .btn.s svg{fill:var(--strong)}
.btn.focus{outline:3px solid #6FB2FF;outline-offset:2px}
.rrow{margin-top:10px;display:flex;gap:10px;align-items:center}
.imdb{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1.5px solid var(--gold);font:700 12px Inter,sans-serif;background:var(--solid)}
.imdb small{background:var(--gold);color:#000;font:900 10px Inter,sans-serif;padding:2px 5px;border-radius:4px}
.imdb svg{width:13px;height:13px;fill:var(--gold)}
.chip{height:28px;padding:0 12px;border-radius:14px;background:var(--solid);border:1px solid var(--glassBorder);display:flex;align-items:center;gap:6px;font:12px "Noto Sans Arabic",Inter,sans-serif;color:var(--strong)}
.chip svg{width:13px;height:13px;fill:var(--label)}
.head{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font:700 13px "Noto Sans Arabic",sans-serif;color:var(--strong)}
.more{color:var(--azure);font:600 12px "Noto Sans Arabic",sans-serif;display:flex;gap:4px;align-items:center;white-space:nowrap}
.more svg{width:14px;height:14px;fill:var(--azure)}
/* 4. strong words */
.plot{margin-top:3px;font-size:12.5px;line-height:1.55;color:var(--strong);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.tv .plot{font-size:16px;-webkit-line-clamp:4;margin-top:6px}
.people{margin-top:6px;font-size:12px;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people b{font:600 12px "Noto Sans Arabic",sans-serif;color:var(--label)}
.tv .people{font-size:15px;margin-top:10px}
.tv .people b{font-size:15px}

/* ---------- 5. what is a show's own, below: on the plain ground ---------- */
.below{position:absolute;left:40px;right:40px;top:322px}
.season{height:46px;border-radius:14px;background:var(--panel);border:1px solid var(--edgeSoft);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font:600 14px "Noto Sans Arabic",sans-serif}
.season small{color:var(--muted);font-weight:400}

.tag{position:absolute;bottom:8px;left:10px;font:11px Inter;color:rgba(255,255,255,.45);direction:ltr}
.legend{position:absolute;top:8px;left:10px;font:11px Inter;color:rgba(255,255,255,.6);direction:ltr;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M4 11h12.2l-5.6-5.6L12 4l8 8-8 8-1.4-1.4 5.6-5.6H4z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21l-1.5-1.3C5.4 15.1 2 12.1 2 8.4 2 5.4 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.2 3.8 14.9 3 16.6 3 19.6 3 22 5.4 22 8.4c0 3.7-3.4 6.7-8.5 11.3z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 17.3l6.2 3.7-1.6-7 5.4-4.7-7.2-.6L12 2 9.2 8.7 2 9.3l5.4 4.7-1.6 7z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7z"/></symbol>
  <symbol id="i-mask" viewBox="0 0 24 24"><path d="M3 3h10v6c0 3-2.2 5.5-5 5.5S3 12 3 9zm2 3v1h2V6zm4 0v1h2V6zM11 10h10v6c0 3-2.2 5.5-5 5.5S11 19 11 16z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2l10 6-10 6L2 8zm0 14.5l8.3-5 1.7 1-10 6-10-6 1.7-1z"/></symbol>
  <symbol id="i-cat" viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11zM17.5 13a4.5 4.5 0 100 9 4.5 4.5 0 000-9zM3 13.5h8v8H3z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></symbol>
</svg>
<div id="out"></div>
<script>
const I=(id)=>`<svg viewBox="0 0 24 24"><use href="#${id}"/></svg>`;
const fact=(ic,t,prov)=>`<span>${I(ic)}${prov?`<span class="prov">${t}</span>`:t}</span>`;
const bar=(xs)=>`<div class="facts">${xs.join('<i></i>')}</div>`;

/* the one template: every page fills the same slots, and a slot it has nothing for is left out */
function template(d,{tv,focus,pic}){
  const pw=tv?300:165, ph=Math.round(pw*1.5);
  return `<div class="page">
    <div class="poster ${pic}" style="width:${pw}px;height:${ph}px"><b>${d.posterWord}</b></div>
    <div class="info">
      <div class="trow"><div class="name prov">${d.name}</div><div class="back">${I('i-back')}</div></div>
      ${bar(d.facts)}
      <div class="btns"><div class="btn p ${focus?'focus':''}">${I('i-play')}${d.play}</div><div class="btn s">${I('i-heart')}إضافة إلى المفضلة</div></div>
      ${d.rating||d.added?`<div class="rrow">${d.rating?`<div class="imdb"><small>IMDb</small>${I('i-star')}${d.rating}</div>`:''}${d.added?`<div class="chip">${I('i-cal')}أُضيف في ${d.added}</div>`:''}</div>`:''}
      <div class="head"><span>القصة</span><span class="more">عرض الكل ${I('i-chev')}</span></div>
      <div class="plot prov">${d.plot}</div>
      ${d.people.map(([l,n])=>`<div class="people prov"><b>${l}</b> ${n}</div>`).join('')}
    </div></div>
    ${d.below?d.below():''}`;
}
const FILM={posterWord:'BEFORE SUNRISE',name:'EN - Before Sunrise (1995)',play:'تشغيل الفيلم',rating:'8.0',added:'23/10/2025',
  facts:[fact('i-cat','TOP IMDB/OSCAR MOVIES',true),fact('i-cal','1995'),fact('i-clock','1h 41m',true),fact('i-mask','Drama | Romance',true)],
  plot:'An unexpected meeting on a train leads two travelers to spend an evening wandering through Vienna. As the night unfolds, they share stories and conversations about life and love.',
  people:[['المخرج:','Richard Linklater'],['الممثلون:','Ethan Hawke · Julie Delpy · Andrea Eckert']]};
const SHOW={posterWord:'SPINNING OUT',name:'NL - SPINNING OUT',play:'تشغيل S1 E1',rating:'8.0',added:null,
  facts:[fact('i-layers','موسم واحد'),fact('i-cal','2020'),fact('i-mask','Drama',true)],
  plot:'Nadat een val bijna haar carrière eindigt, grijpt een opkomende single skater een kans om door te gaan als een paar-schaatser.',
  people:[['الممثلون:','Kaya Scodelario · January Jones · Willow Shields']],
  below:()=>`<div class="below"><div class="season"><span>10 حلقات</span><span>الموسم 1 <small>(10 حلقات)</small></span></div></div>`};

function screen({size,d,pic,backdrop=true,arriving=false,focus=false,label,legend}){
  const tv=size==='tv';
  return `<div class="screen ${size} ${arriving?'arriving':''}">
    ${backdrop?`<div class="bd ${pic}"></div><div class="black"></div><div class="scrim"></div>`:''}
    ${template(d,{tv,focus,pic:backdrop?pic:'flat'})}
    ${legend?`<div class="legend">${legend}</div>`:''}
    <div class="tag">${label}</div></div>`;
}
const frames={
  film:{c:'<b>الفيلم على الهاتف.</b> الخلفية أنعم (تُطلب صغيرة w300 وتُكبَّر، فتنعم على كل جهاز) وأغمق: أسود 0.28 ثم تدرّج 0.92 تحت النص و0.20 عند البوستر. الشريط والمفضلة والتقييم على أرضية داكنة شبه معتمة. القصة والأسماء بالحبر القوي، والتسميات أخفت.',
        h:screen({size:'phone',d:FILM,pic:'dusk',label:'film · phone 833x385'})},
  show:{c:'<b>المسلسل على الهاتف، من القالب نفسه وبالترتيب نفسه.</b> الاسم، الشريط (المواسم، السنة، النوع)، الزرّان، صف التقييم، «القصة» و«عرض الكل»، القصة، الممثلون، ثم ما يخصّه: المواسم والحلقات على الأرضية العادية. ما لا يملكه (تاريخ الإضافة) لا يُرسم ويضيق الصف.',
        h:screen({size:'phone',d:SHOW,pic:'ice',label:'show · phone 833x385'})},
  tv:{c:'<b>التلفاز (960×540)، والتركيز على «تشغيل».</b> المقاسات أكبر، والقصة ثلاثة أسطر.',
        h:screen({size:'tv',d:FILM,pic:'dusk',focus:true,label:'film · tv 960x540 · remote on Play'})},
  bright:{c:'<b>أصعب حالة: صورة فاتحة جدًا.</b> الأسود والتدرّج يكفيان: النص الأبيض واضح، والشريط والأزرار على أرضيتها الداكنة.',
        h:screen({size:'phone',d:FILM,pic:'snow',label:'very bright picture'})},
  none:{c:'<b>لا صورة عريضة، أو فشلت.</b> الصفحة على التدرّج اللوني القديم للتطبيق، بلا فراغ ولا مربع فارغ. الصورة ليست شرطًا لظهور الصفحة أبدًا.',
        h:screen({size:'phone',d:SHOW,pic:'ice',backdrop:false,label:'no wide picture: the old gradient',legend:'no backdrop'})},
  arriving:{c:'<b>الصورة في الطريق.</b> الصفحة تُرسم فورًا على التدرّج القديم، والصورة تظهر فوقه بتلاشٍ حين تصل (وفورًا في أدنى مستوى حركة).',
        h:screen({size:'phone',d:FILM,pic:'dusk',arriving:true,label:'picture arriving · fades in',legend:'fading in'})},
};
const q=new URLSearchParams(location.search).get('frame')||'sheet';
const out=document.getElementById('out');
if(q==='sheet'){document.body.classList.add('sheet');out.innerHTML=Object.values(frames).map(f=>`<div class="cap">${f.c}</div>${f.h}`).join('');}
else out.innerHTML=frames[q].h;
// ?clean=1: the screen alone, with no label of the drawing's own on it.
if(new URLSearchParams(location.search).get('clean')) document.querySelectorAll('.tag,.legend').forEach(e=>e.remove());
</script>
</body>
</html>
